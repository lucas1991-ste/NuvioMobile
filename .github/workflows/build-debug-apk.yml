name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "app/enhanced" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: app/enhanced
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create empty local.properties
        run: touch local.properties

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleFullDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-debug-apk
          path: composeApp/build/outputs/apk/full/debug/*.apk
          retention-days: 30
          if-no-files-found: error
